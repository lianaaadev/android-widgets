<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #0A0A0D; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB43C; } a:hover { color: #FFC96E; }
  </style>
</helmet>

<div style="width: 880px; height: 600px; background: #0A0A0D; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 30px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.01em; color: #F5F5F7;">Cover screen — Flex Window</div>
    <div style="font-size: 14px; color: #63636F;">Shown at actual size, 352 × 339 dp. Read in about two seconds, at arm's length, without opening the phone.</div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 56px;">

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="width: 352px; height: 339px; border-radius: 20px; background: #121218; border: 1px solid #23232E; box-sizing: border-box; padding: 30px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.16em; color: #F5F5F7;">JAPAN TRIP</div>
          <div style="font-size: 22px;">✈️</div>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 16px;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 178px; line-height: 0.74; letter-spacing: -0.06em; color: #5BD1EA;">7</div>
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.22em; color: #7A7A88; padding-bottom: 14px;">DAYS</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="height: 2px; background: #5BD1EA;"></div>
          <div style="font-size: 14px; color: #7A7A88;">Thursday 3 September</div>
        </div>
      </div>
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 12px; color: #C9C9D4;">Counting down</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="width: 352px; height: 339px; border-radius: 20px; background: #FFB43C; box-sizing: border-box; padding: 30px; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.16em; color: #14141A;">MUM'S BIRTHDAY</div>
          <div style="font-size: 22px;">🎂</div>
        </div>
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 92px; line-height: 0.82; letter-spacing: -0.05em; color: #14141A;">TODAY</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="height: 2px; background: #14141A; opacity: 0.4;"></div>
          <div style="font-size: 14px; color: #14141A; opacity: 0.75;">Monday 12 October</div>
        </div>
      </div>
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 12px; color: #C9C9D4;">The day itself</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
