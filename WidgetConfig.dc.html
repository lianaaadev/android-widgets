<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #0E0E12; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB43C; } a:hover { color: #FFC96E; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #0E0E12; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 26px; padding: 62px 24px 0 24px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: #F5F5F7;">What should this widget count?</div>
      <div style="font-size: 13px; line-height: 1.5; color: #63636F;">Each widget follows one occasion. Add as many as you like.</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; padding: 6px 0 2px 0;">
      <div style="width: 150px; height: 150px; border-radius: 14px; background: #15151C; border: 1px solid #24242F; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; color: #C9C9D4;">JAPAN TRIP</div>
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 66px; line-height: 0.82; letter-spacing: -0.05em; color: #5BD1EA;">7</div>
        <div style="font-size: 10px; letter-spacing: 0.06em; color: #63636F;">days · 3 Sep</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: center; gap: 13px; background: #15151C; border: 2px solid #5BD1EA; border-radius: 6px; padding: 13px 15px;">
        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 4px; background: #1E1E27; display: flex; align-items: center; justify-content: center; font-size: 16px;">✈️</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #F5F5F7;">Japan Trip</div>
          <div style="font-size: 12px; color: #63636F;">3 Sep 2026</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5BD1EA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #121218; border: 1px solid #24242F; border-radius: 6px; padding: 14px 16px;">
        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 4px; background: #1A1A22; display: flex; align-items: center; justify-content: center; font-size: 16px;">🎫</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #C9C9D4;">Radiohead, Budokan</div>
          <div style="font-size: 12px; color: #5A5A66;">19 Sep 2026</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #121218; border: 1px solid #24242F; border-radius: 6px; padding: 14px 16px;">
        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 4px; background: #1A1A22; display: flex; align-items: center; justify-content: center; font-size: 16px;">🎂</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #C9C9D4;">Mum's Birthday</div>
          <div style="font-size: 12px; color: #5A5A66;">12 Oct 2026 · every year</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #121218; border: 1px solid #24242F; border-radius: 6px; padding: 14px 16px;">
        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 4px; background: #1A1A22; display: flex; align-items: center; justify-content: center; font-size: 16px;">💍</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #C9C9D4;">Our Anniversary</div>
          <div style="font-size: 12px; color: #5A5A66;">20 Nov 2026 · every year</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; border: 1px dashed #2E2E3A; border-radius: 6px; padding: 14px 16px;">
        <div style="width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFB43C" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #FFB43C;">Something new</div>
      </div>

    </div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; display: flex; align-items: center; gap: 12px;">
    <div style="height: 54px; flex-grow: 1; border-radius: 6px; border: 1px solid #2A2A35; display: flex; align-items: center; justify-content: center;">
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #9C9CAB;">Cancel</div>
    </div>
    <div style="height: 54px; flex-grow: 1.6; border-radius: 6px; background: #5BD1EA; display: flex; align-items: center; justify-content: center;">
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; color: #0E0E12;">Add widget</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
