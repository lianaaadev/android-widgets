<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #0E0E12; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB43C; } a:hover { color: #FFC96E; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #0E0E12; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 24px; padding: 62px 24px 0 24px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.22em; color: #63636F;">COUNTDOWN</div>
    </div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 210px; display: flex; flex-direction: column; gap: 36px;">

    <div style="display: flex; align-items: flex-end; gap: 14px;">
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 132px; line-height: 0.78; letter-spacing: -0.06em; color: #22222C;">00</div>
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.22em; color: #22222C; padding-bottom: 10px;">DAYS</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 27px; line-height: 1.15; letter-spacing: -0.02em; color: #F5F5F7; text-wrap: pretty;">Nothing on the horizon.</div>
      <div style="font-size: 15px; line-height: 1.6; color: #7A7A88; text-wrap: pretty; max-width: 300px;">A birthday, a flight, a lease running out — anything worth watching get closer. Add one and put it on your home screen.</div>
    </div>

  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; height: 54px; border-radius: 6px; background: #FFB43C; display: flex; align-items: center; justify-content: center; gap: 9px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E12" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; color: #0E0E12;">Add your first occasion</div>
  </div>

</div>
