<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #0E0E12; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB43C; } a:hover { color: #FFC96E; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #0E0E12; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 30px; padding: 62px 24px 0 24px;">

    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9C9CAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 17px; color: #F5F5F7;">New occasion</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 24px;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; color: #4E4E5A;">WHAT ARE YOU WAITING FOR</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; color: #F5F5F7;">Mum's Birthday</div>
          <div style="height: 2px; background: #FFB43C;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; color: #4E4E5A;">WHEN</div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #15151C; border: 1px solid #24242F; border-radius: 6px; padding: 15px 16px;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 16px; color: #F5F5F7;">12 October 2026</div>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#63636F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #15151C; border: 1px solid #24242F; border-radius: 6px; padding: 14px 16px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #F5F5F7;">Repeats every year</div>
          <div style="font-size: 12px; color: #63636F;">Starts again the day after</div>
        </div>
        <div style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: #FFB43C; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px;">
          <div style="width: 22px; height: 22px; border-radius: 11px; background: #0E0E12;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; color: #4E4E5A;">MARK</div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 46px; height: 46px; border-radius: 4px; background: #1E1E27; border: 2px solid #FFB43C; display: flex; align-items: center; justify-content: center; font-size: 20px;">🎂</div>
          <div style="width: 46px; height: 46px; border-radius: 4px; background: #15151C; border: 1px solid #24242F; display: flex; align-items: center; justify-content: center; font-size: 20px;">🎈</div>
          <div style="width: 46px; height: 46px; border-radius: 4px; background: #15151C; border: 1px solid #24242F; display: flex; align-items: center; justify-content: center; font-size: 20px;">✈️</div>
          <div style="width: 46px; height: 46px; border-radius: 4px; background: #15151C; border: 1px solid #24242F; display: flex; align-items: center; justify-content: center; font-size: 20px;">💍</div>
          <div style="width: 46px; height: 46px; border-radius: 4px; background: #15151C; border: 1px solid #24242F; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#63636F" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; color: #4E4E5A;">COLOUR</div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #FFB43C; border: 3px solid #0E0E12; box-shadow: 0 0 0 2px #FFB43C;"></div>
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #FF7A6B;"></div>
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #FF8FC4;"></div>
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #B79BFF;"></div>
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #5BD1EA;"></div>
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #A9E05A;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; color: #4E4E5A;">ON YOUR HOME SCREEN</div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <div style="width: 132px; height: 132px; flex-shrink: 0; border-radius: 12px; background: #15151C; border: 1px solid #24242F; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;">
            <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.14em; color: #9C9CAB;">MUM'S BIRTHDAY</div>
            <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 52px; line-height: 0.85; letter-spacing: -0.05em; color: #FFB43C;">46</div>
            <div style="font-size: 10px; letter-spacing: 0.06em; color: #63636F;">days · 12 Oct</div>
          </div>
          <div style="font-size: 13px; line-height: 1.55; color: #63636F;">This is what the widget will look like. You can place it once you've saved.</div>
        </div>
      </div>

    </div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; height: 54px; border-radius: 6px; background: #FFB43C; display: flex; align-items: center; justify-content: center;">
    <div style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: #0E0E12;">Save occasion</div>
  </div>

</div>
</x-dc>
</body>
</html>
